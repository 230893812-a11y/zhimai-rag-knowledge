name: Deploy production site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-production:
    if: ${{ github.repository == '230893812-a11y/zhimai-rag-knowledge' }}
    runs-on: ubuntu-24.04
    name: Deploy production to Cloudflare Pages
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - run: npm install

      - name: Install Quartz plugins
        run: node quartz/bootstrap-cli.mjs plugin install

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Build graph data
        run: python scripts/build_graph_data.py

      - name: Validate graph data
        run: python scripts/validate_graph_data.py

      - name: Build Quartz
        run: node quartz/bootstrap-cli.mjs build -d content/imported/langjian-knowledge-2026-v4 -v

      - name: Compact content index for Pages file-size limit
        run: python scripts/compact_content_index.py public/static/contentIndex.json --chars 600

      - name: Deploy to Cloudflare Pages
        uses: AdrianGonz97/refined-cf-pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          projectName: zhimai-rag-knowledge
          deploymentName: Production main
          branch: main
          directory: public
